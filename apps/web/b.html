<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live brief — Skywatch</title>
<meta name="description" content="Your live Skywatch safety brief — shared from a text.">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="icons/icon-32.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* b.html — standalone shared-brief page; reuses the app's tokens/components */
  .bwrap { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding: 30px 17px 130px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .bhead { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .bhead img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
  .bhead b { font-family: var(--fd); font-size: 16px; }
  .bsub { color: var(--text3); font-size: 12px; margin: 2px 0 6px; }
  .sev { padding: 3px 8px; font-size: 10.5px; }
  .hz-card { display: flex; gap: 11px; align-items: center; margin-top: 10px; }
  .action-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text); }
  .b911 a {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    background: var(--danger); color: #2c0805; min-height: 48px; border-radius: 15px;
    font-family: var(--fd); font-weight: 700; font-size: 16px;
  }
</style>
</head>
<body>
<div class="bwrap" id="bwrap">
  <header class="bhead">
    <img src="brand/logo.png" alt="" onerror="this.remove()">
    <b>Skywatch · live brief</b>
  </header>
  <p class="bsub">The safety brief Skywatch texts you — opened in the browser.</p>
  <div id="bbody"></div>
  <div id="b911zone"></div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  var SEV = [
    { n: 4, label: "SEVERE", cls: "chip chip-danger sev" },
    { n: 3, label: "HIGH", cls: "chip chip-danger sev" },
    { n: 2, label: "ELEVATED", cls: "chip chip-warn sev" },
    { n: 1, label: "WATCH", cls: "chip chip-n sev" },
  ];
  var hzIcon = function (type) {
    return type === "flood"
      ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5.5c1.5-1.5 4-1.5 5.5 0s4 1.5 5.5 0 4-1.5 5.5 0M3 11c1.5-1.5 4-1.5 5.5 0s4 1.5 5.5 0 4-1.5 5.5 0M3 16.5c1.5-1.5 4-1.5 5.5 0s4 1.5 5.5 0 4-1.5 5.5 0"/></svg>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 9.5a5 5 0 1 0-9.8 1.4A3.5 3.5 0 0 0 8 17.5h8a4 4 0 0 0 1-8z"/></svg>';
  };
  var svgs = {
    shield: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3.2v4.9c0 4.3-3.2 8.1-7.5 9.4-4.3-1.3-7.5-5.1-7.5-9.4V6.2L12 3z"/></svg>',
    shieldCheck: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3.2v4.9c0 4.3-3.2 8.1-7.5 9.4-4.3-1.3-7.5-5.1-7.5-9.4V6.2L12 3z"/><path d="M9 11.6l2.1 2.1L15.4 9"/></svg>',
    phone: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4.2-2 1.5a12 12 0 0 0 6.3 6.3l1.5-2L21 14.5v3A2.5 2.5 0 0 1 18.5 20 15.5 15.5 0 0 1 4 5.5 2.5 2.5 0 0 1 6.5 3z"/></svg>',
    info: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 10.5V17M12 7.5h.01"/></svg>',
  };
  function lsCfg() {
    try { return JSON.parse(localStorage.getItem("skywatch.cfg") || "{}"); } catch (_e) { return {}; }
  }
  function apiBase() { return String(lsCfg().api || "").replace(/\/+$/, ""); }
  function withSecret(headers) {
    var t = lsCfg().toolSecret;
    if (t) headers["X-Skywatch-Tool-Secret"] = t;
    return headers;
  }

  // PUBLIC_BASE_URL + "/b/" + userId — the API route /b/:id serves this page with
  // window.SKYWATCH_BRIEF_ID injected (preferred); ?id= and the /b/<id> path stay
  // as fallbacks for the static/preview hosting paths.
  var id = window.SKYWATCH_BRIEF_ID || new URLSearchParams(location.search).get("id") || (location.pathname.match(/\/b\/([^/.]+)/) || [])[1] || "";
  var body = $("#bbody");

  function skeleton() {
    body.innerHTML =
      '<div class="skel" style="height:92px;margin-bottom:10px"></div>' +
      '<div class="skel" style="height:150px;margin-bottom:10px"></div>' +
      '<div class="skel" style="height:118px"></div>';
  }
  function failCard(title, note) {
    body.innerHTML =
      '<div class="empty">' + svgs.shield + "<b>" + esc(title) + "</b><p>" + esc(note) + "</p></div>";
  }
  function card(inner) {
    return '<div class="card">' + inner + "</div>";
  }
  function hzLine(b) {
    var has = (b.hazards || []).length > 0;
    return card(
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
        '<span style="font-family:var(--fd);font-weight:700;font-size:15px">' + (has ? "Current hazards" : "All clear in this area") + "</span>" +
        (has ? '<span class="chip chip-danger sev">' + b.hazards.length + " active</span>"
             : '<span class="chip chip-ok sev">clear</span>') +
      "</div>");
  }
  function hazards(b) {
    return (b.hazards || []).map(function (hz) {
      var sev = SEV.find(function (s) { return s.n === hz.severity; }) || SEV[3];
      var tone = hz.severity >= 3 ? "danger" : "warn";
      return card(
        '<div style="display:flex;gap:11px;align-items:center">' +
          '<div style="width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--' + tone + '-dim);color:var(--' + tone + ')">' + hzIcon(hz.type) + "</div>" +
          '<div style="flex:1;min-width:0"><b style="font-size:14px;font-family:var(--fd)">' + esc(hz.title) + "</b>" +
          '<div style="font-size:12.5px;color:var(--text2);margin-top:5px">' + esc(hz.timing || "") + "</div></div>" +
          '<span class="' + sev.cls + '">' + sev.label + "</span>" +
        "</div>");
    }).join("");
  }
  function actions(b) {
    return (b.actions || []).length
      ? card(
          '<div style="display:flex;flex-direction:column">' +
            (b.actions || []).map(function (a, i) {
              return '<div class="action-row"><span style="font-family:var(--mono);color:var(--accent);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:3px 7px">' + (i + 1) + "</span><span>" + esc(a.text) + "</span></div>";
            }).join("") +
          "</div>")
      : "";
  }
  function shelter(b) {
    var sh = b.shelter;
    if (!sh) {
      return card('<div style="display:flex;gap:11px;align-items:center;justify-content:center;color:var(--text3);text-align:center">' + svgs.shield +
        '<div style="text-align:left"><b style="font-size:13.5px;display:block;color:var(--text2)">No verified-open shelter here yet</b>' +
        '<span style="font-size:12px">Skywatch only claims a shelter it has verified. Official source below.</span></div></div>');
    }
    var conf = Math.round((sh.confidence || 0) * 100);
    return card(
      '<div style="display:flex;gap:11px;align-items:flex-start">' +
        '<div style="width:38px;height:38px;border-radius:12px;background:var(--ok-dim);color:var(--ok);display:flex;align-items:center;justify-content:center">' + svgs.shieldCheck + "</div>" +
        '<div style="flex:1;min-width:0">' +
          "<b style=\"font-size:14.5px;font-family:var(--fd)\">" + esc(sh.name) + "</b>" +
          '<div style="font-size:12px;color:var(--text3);margin-top:3px">' + esc(sh.hours || "") + "</div>" +
          '<div style="font-family:var(--mono);font-size:12px;color:var(--text2);margin-top:3px">' + esc(String(sh.distanceKm)) + " km away · verified " + esc(String(sh.verifiedMinutesAgo)) + " min ago</div>" +
          '<div class="confbar"><i style="width:' + conf + '%"></i></div>' +
          '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text3)">' +
            "<span>confidence " + conf + "%</span>" +
            '<span class="chip chip-ok">' + (sh.status === "open" ? "VERIFIED OPEN" : esc(String(sh.status).toUpperCase())) + "</span>" +
          "</div>" +
        "</div></div>");
  }
  function source(b) {
    return b.officialSource
      ? card('<div style="display:flex;gap:11px;align-items:center">' +
          '<div style="width:34px;height:34px;border-radius:11px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center">' + svgs.info + "</div>" +
          '<div style="flex:1;min-width:0"><b style="font-size:13.5px">' + esc(b.officialSource.name || "Official source") + "</b>" +
          '<a style="display:block;margin-top:2px;font-size:12px" href="' + esc(b.officialSource.url || "#") + '" target="_blank" rel="noopener">' + esc(b.officialSource.url || "") + "</a></div></div>")
      : "";
  }
  function nine11(b) {
    var zone = $("#b911zone");
    if (!(b && (b.hazards || []).length)) { zone.innerHTML = ""; return; }
    zone.innerHTML =
      '<div style="position:sticky;bottom:0;margin:14px -4px 0;padding:12px 4px;background:linear-gradient(transparent, var(--bg) 40%)" class="b911">' +
      '<a href="tel:911" aria-label="Tap to call 911"><span style="display:inline-flex">' + svgs.phone + '</span>911 — Emergency</a></div>';
  }

  if (!id) {
    failCard("This link is missing its id", "The brief link from your text should look like …/b/<id>");
  } else {
    skeleton();
    var t0 = apiBase() + "/b/" + encodeURIComponent(id) + "/data";
    fetch(t0, { headers: withSecret({ "Accept": "application/json" }) })
      .then(function (r) {
        if (r.status === 401) { failCard("This server checks the tool secret", "Open the Skywatch app → Profile → Connection details, save the server's TOOL_SECRET, and reopen this link."); return null; }
        if (r.status === 404) { failCard("No brief for that link", "This brief link isn't live (user unknown or removed). If you just signed up, give it a moment and reopen."); return null; }
        if (!r.ok) { failCard("Brief unavailable", "The server answered " + r.status + " — try again in a moment."); return null; }
        return r.json();
      })
      .then(function (b) {
        if (!b) return;
        var hasHaz = (b.hazards || []).length > 0;
        body.innerHTML =
          hzLine(b) +
          (hasHaz ? '<div id="hzList"></div>' : "") +
          '<div id="actZone" style="margin-top:14px"></div>' +
          '<div id="shZone" style="margin-top:14px"></div>' +
          '<div id="srcZone" style="margin-top:14px"></div>' +
          '<p style="font-size:11.5px;color:var(--text3);text-align:center;margin-top:16px">Assembled just now · same brief pipeline as your texts</p>';
        if (hasHaz) $("#hzList", body).innerHTML = hazards(b);
        var az = $("#actZone", body);
        az.innerHTML = '<div class="sec-label" style="margin:0 0 10px">What to do<small>in order — read to you on check-in calls too</small></div>' + (actions(b) || '<div class="card" style="font-size:13px;color:var(--text3)">No actions in the brief — all quiet instructions.</div>');
        var sz = $("#shZone", body);
        sz.innerHTML = '<div class="sec-label" style="margin:0 0 10px">' + (b.shelter ? "Verified shelter" : "Shelters<small>the honest state — no unverified claims</small>") + "</div>" + shelter(b);
        var zc = $("#srcZone", body);
        zc.innerHTML = '<div class="sec-label" style="margin:0 0 10px">Official source</div>' + (source(b) || '<div class="card" style="font-size:13px;color:var(--text3)">No official source listed in the brief.</div>');
        nine11(b);
      })
      .catch(function () {
        failCard("Couldn't reach the server", "No signal — open this link again once you have connectivity. The text keeps working either way.");
      });
  }
})();
</script>
</body>
</html>
